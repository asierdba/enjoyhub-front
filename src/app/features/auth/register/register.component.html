@if (modalService.isOpen()) {
  <div class="register-overlay" (click)="close()">
    <div class="register-modal" (click)="$event.stopPropagation()">

      <button class="register-modal__close" type="button" (click)="close()">✕</button>

      <div class="register-modal__header">
        <h2 class="register-modal__title">Crear cuenta</h2>
        <p class="register-modal__subtitle">Únete y empieza a guardar tu contenido favorito</p>
      </div>

      @if (authError()) {
        <p class="register-modal__error">{{ authError() }}</p>
      }

      <form class="register-modal__form" [formGroup]="form" (ngSubmit)="onSubmit()">

        <div class="register-modal__field">
          <label class="register-modal__label">Elige tu avatar</label>
          <div class="register-modal__icons">
            @for (item of profileIcons; track item.id) {
              <button
                type="button"
                class="register-modal__icon-btn"
                [class.register-modal__icon-btn--selected]="form.value.profileIcon === item.id"
                (click)="selectIcon(item.id)"
                [title]="item.label"
              >
                <fa-icon [icon]="item.icon" />
              </button>
            }
          </div>
        </div>

        <div class="register-modal__field">
          <label class="register-modal__label" for="reg-userName">Nombre de usuario</label>
          <input
            id="reg-userName"
            class="register-modal__input"
            formControlName="userName"
            type="text"
            placeholder="Tu nombre de usuario"
            autocomplete="username"
          />
        </div>

        <div class="register-modal__field">
          <label class="register-modal__label" for="reg-email">Correo electrónico</label>
          <input
            id="reg-email"
            class="register-modal__input"
            formControlName="email"
            type="email"
            placeholder="correo@ejemplo.com"
            autocomplete="email"
          />
        </div>

        <div class="register-modal__field">
          <label class="register-modal__label" for="reg-password">Contraseña</label>
          <input
            id="reg-password"
            class="register-modal__input"
            formControlName="password"
            type="password"
            placeholder="Mínimo 6 caracteres"
            autocomplete="new-password"
          />
        </div>

        <div class="register-modal__field">
          <label class="register-modal__label" for="reg-confirm">Confirmar contraseña</label>
          <input
            id="reg-confirm"
            class="register-modal__input"
            [class.register-modal__input--error]="passwordMismatch"
            formControlName="confirmPassword"
            type="password"
            placeholder="Repite tu contraseña"
            autocomplete="new-password"
          />
          @if (passwordMismatch) {
            <span class="register-modal__field-error">Las contraseñas no coinciden</span>
          }
        </div>

        <button
          class="register-modal__submit"
          type="submit"
          [disabled]="form.invalid || authLoading()"
        >
          {{ authLoading() ? 'Creando cuenta...' : 'Crear cuenta' }}
        </button>

      </form>

      <p class="register-modal__login-link">
        ¿Ya tienes cuenta?
        <button class="register-modal__link" type="button" (click)="close()">
          Inicia sesión aquí
        </button>
      </p>

    </div>
  </div>
}
