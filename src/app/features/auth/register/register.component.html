<div class="register">
  <div class="register__card">

    <div class="register__header">
      <fa-icon [icon]="icons.faUserPlus" class="register__icon" />
      <h1 class="register__title">Crear cuenta</h1>
      <p class="register__subtitle">Únete y empieza a guardar tu contenido favorito</p>
    </div>

    @if (authError()) {
      <p class="register__error">{{ authError() }}</p>
    }

    <form class="register__form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="register__field">
        <label class="register__label" for="userName">Nombre de usuario</label>
        <input
          id="userName"
          class="register__input"
          formControlName="userName"
          type="text"
          placeholder="Tu nombre de usuario"
          autocomplete="userName"
        />
      </div>

      <div class="register__field">
        <label class="register__label" for="email">Correo electrónico</label>
        <input
          id="email"
          class="register__input"
          formControlName="email"
          type="email"
          placeholder="correo@ejemplo.com"
          autocomplete="email"
        />
      </div>

      <div class="register__field">
        <label class="register__label" for="password">Contraseña</label>
        <input
          id="password"
          class="register__input"
          formControlName="password"
          type="password"
          placeholder="Mínimo 6 caracteres"
          autocomplete="new-password"
        />
      </div>

      <button
        class="register__submit"
        type="submit"
        [disabled]="form.invalid || authLoading()"
      >
        {{ authLoading() ? 'Creando cuenta...' : 'Crear cuenta' }}
      </button>
    </form>

    <p class="register__login-link">
      ¿Ya tienes cuenta?
      <a routerLink="/" class="register__link">Inicia sesión aquí</a>
    </p>

  </div>
</div>
